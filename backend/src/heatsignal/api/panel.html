<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>HeatSignal</title>
<link rel="stylesheet" href="/static/app/app.css">
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<header class="topbar">
  <button class="btn small menu-btn" id="menu-btn" type="button" aria-controls="sidenav" aria-expanded="false" aria-label="Abrir menú">☰ Menú</button>
  <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span><span>HeatSignal <small>panel</small></span></a>
  <span class="live" id="live" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span>conectando…</span></span>
  <span class="topmeta" id="topmeta"></span>
  <span class="spacer"></span>
  <button class="btn small" id="theme-btn" type="button" aria-label="Tema">◐</button>
</header>
<div class="shell">
  <nav class="sidenav" id="sidenav" aria-label="Secciones"></nav>
  <main id="main" tabindex="-1">
    <noscript><p>El panel necesita JavaScript.</p></noscript>
  </main>
</div>
<!-- Sin CDN: todo se sirve desde este proceso (túnel SSH). La app pollea /api/summary cada 5 s y hace
     location.reload() cuando cambia `build` (deploy/reinicio): nunca queda una versión vieja abierta. -->
<script src="/static/lightweight-charts.js"></script>
<script type="module" src="/static/app/main.js"></script>
</body>
</html>
